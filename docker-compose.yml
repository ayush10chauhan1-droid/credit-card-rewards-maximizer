version: '3.8'

services:
  swipesmart-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swipesmart-ai-enterprise
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
